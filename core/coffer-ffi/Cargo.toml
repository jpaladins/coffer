[package]
name = "coffer-ffi"
description = "UniFFI bindings of the Coffer core for the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
coffer-crypto.workspace = true
coffer-volume.workspace = true
coffer-vfs.workspace = true
coffer-fs = { path = "../coffer-fs" }
thiserror.workspace = true
zeroize.workspace = true
uniffi = "0.32.2"

[dev-dependencies]
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
